name: Build and Deploy Backend

on:
  push:
    branches: [main]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name:
        run: echo "Building and deploying backend..."

      - name: Set lowercase repository name
        run: echo "REPO=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Set image name
        run: echo "IMAGE=${{ secrets.DOCKER_USERNAME }}/awap-backend:${{ github.sha }}" >> $GITHUB_ENV

      - name: Build container image
        run: docker build -t ${{ env.IMAGE }} ./backend

      - name: Log in to registry
        run: echo "${{ secrets.DOCKER_TOKEN }}" | docker login -u ${{ secrets.DOCKER_USERNAME }} --password-stdin

      - name: Push image
        run: docker push ${{ env.IMAGE }}

      - name: Install OpenShift CLI
        run: |
          curl -L https://mirror.openshift.com/pub/openshift-v4/clients/ocp/stable/openshift-client-linux.tar.gz -o oc.tar.gz
          tar -xzf oc.tar.gz
          sudo mv oc /usr/local/bin/
          oc version --client

      - name: Deploy to Rahti
        run: |
          oc login --token=${{ secrets.RAHTI_TOKEN }} --server=${{ secrets.RAHTI_SERVER }}
          oc project "${{ secrets.RAHTI_PROJECT }}"
          oc set image deployment/backend backend=${{ env.IMAGE }}
